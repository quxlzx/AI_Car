name: Simulation tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Processing / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download verified Processing Core 4.3.1
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          from urllib.request import urlopen

          url = 'https://repo.maven.apache.org/maven2/org/processing/core/4.3.1/core-4.3.1.jar'
          expected = '245f454ceb89c2cd03bc9b1ea85159769495279af8293ffab688f330c6a80ce1'
          with urlopen(url, timeout=60) as response:
              data = response.read()
          if hashlib.sha256(data).hexdigest() != expected:
              raise SystemExit('Processing Core checksum mismatch')
          Path('core.jar').write_bytes(data)
          PY
      - name: Compile sketch, test simulation, and render frame
        run: python tests/run_tests.py --core core.jar --render test-preview.png
      - name: Upload rendered frame
        uses: actions/upload-artifact@v4
        with:
          name: sketch-preview-${{ matrix.os }}
          path: test-preview.png
